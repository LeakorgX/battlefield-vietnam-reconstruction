name: Import reviewed source snapshot
on:
  push:
    paths: [".github/workflows/import-source.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and expand reviewed archive
        shell: bash
        run: |
          set -euo pipefail
          echo "afdee7c6047f62032d3f815f4e546ac05cfad1542386e028bf1bb63428e7a75c  battlefield-vietnam-reconstruction-source.zip" | sha256sum -c -
          unzip -o battlefield-vietnam-reconstruction-source.zip
          git rm battlefield-vietnam-reconstruction-source.zip .github/workflows/import-source.yml
          git add README.md LICENSE NOTICE.md .gitignore bfv-native-code bevy-remake docs reports
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Expand reviewed reconstructed source, tools, and evidence into repository"
          git push origin HEAD:main
